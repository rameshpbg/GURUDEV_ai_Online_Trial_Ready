[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gurudev-ai"
version = "0.3.0"
description = "GURUDEV.ai breeder companion with voice interface and auditable scientific workflows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.2", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "matplotlib>=3.6"]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
llm = ["openai>=1.30"]
agentic = ["openai-agents>=0.2"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
gurudev = "gurudev_ai.cli:main"
gurudev-companion = "gurudev_ai.companion.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"gurudev_ai.companion" = ["static/*"]
